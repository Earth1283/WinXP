name: Build Installer

# Compiles installer/ (the standalone Windows XP Setup Wizard -- see
# installer/wizard.py) into a native Windows binary with Nuitka, and on
# a tag push, attaches it to a GitHub Release. macOS is not built --
# Nuitka's onefile mode doesn't support PyQt6 on macOS. The installer has
# no dependency on the winxp package at build time -- it fetches winxp from
# this repo at *run* time, so this workflow only ever needs to build
# installer/__main__.py itself.
#
# Trigger a build without cutting a release: Actions tab -> Build Installer
# -> Run workflow. Cut a real release: push a tag matching installer-v*.

on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 nuitka

      - name: Build with Nuitka
        run: >
          python -m nuitka
          --standalone
          --onefile
          --enable-plugin=pyqt6
          --windows-console-mode=disable
          --output-filename=WindowsXP-Setup.exe
          --output-dir=dist
          --assume-yes-for-downloads
          installer/__main__.py

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p out
          cp "dist/WindowsXP-Setup.exe" "out/WindowsXP-Setup-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsXP-Setup-windows.exe
          path: out/WindowsXP-Setup-windows.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/installer-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          name: Windows XP Setup ${{ github.ref_name }}
          files: release/*
          body: |
            Automated build of the Windows XP Setup Wizard (`installer/`).

            This binary is unsigned, on purpose -- this is a joke project,
            not a real OS installer. Windows SmartScreen will flag it on
            first run: click "More info" -> "Run anyway".

            The installer fetches the actual sim from this repo's `main`
            branch at run time, so it always installs the latest commit,
            not a snapshot from when this binary was built.
