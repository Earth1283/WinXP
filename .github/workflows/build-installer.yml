name: Build Installer

on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 nuitka

      - name: Build with Nuitka
        run: >
          python -m nuitka
          --standalone
          --onefile
          --enable-plugin=pyqt6
          --windows-console-mode=disable
          --output-filename=WindowsXP-Setup.exe
          --output-dir=dist
          --assume-yes-for-downloads
          installer/__main__.py

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p out
          cp "dist/WindowsXP-Setup.exe" "out/WindowsXP-Setup-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsXP-Setup-windows.exe
          path: out/WindowsXP-Setup-windows.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/installer-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          name: Windows XP Setup ${{ github.ref_name }}
          files: release/*
          body: |
            Automated build of the Windows XP Setup Wizard (`installer/`).

            This binary is unsigned, on purpose -- this is a joke project,
            not a real OS installer. Windows SmartScreen will flag it on
            first run: click "More info" -> "Run anyway".

            The installer fetches the actual sim from this repo's `main`
            branch at run time, so it always installs the latest commit,
            not a snapshot from when this binary was built.
