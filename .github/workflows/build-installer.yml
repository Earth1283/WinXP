name: Build Installer

# Compiles installer/ (the standalone Windows XP Setup Wizard -- see
# installer/wizard.py) into a native binary per platform with Nuitka, and on
# a tag push, attaches both binaries to a GitHub Release. The installer has
# no dependency on the winxp package at build time -- it fetches winxp from
# this repo at *run* time, so this workflow only ever needs to build
# installer/__main__.py itself.
#
# Trigger a build without cutting a release: Actions tab -> Build Installer
# -> Run workflow. Cut a real release: push a tag matching installer-v*.

on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: WindowsXP-Setup-windows.exe
            nuitka_output: WindowsXP-Setup.exe
          - os: macos-latest
            asset_name: WindowsXP-Setup-macos
            nuitka_output: WindowsXP-Setup
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 nuitka

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m nuitka
          --standalone
          --onefile
          --enable-plugin=pyqt6
          --windows-console-mode=disable
          --output-filename=WindowsXP-Setup.exe
          --output-dir=dist
          --assume-yes-for-downloads
          installer/__main__.py

      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: >
          python -m nuitka
          --standalone
          --onefile
          --enable-plugin=pyqt6
          --output-filename=WindowsXP-Setup
          --output-dir=dist
          --assume-yes-for-downloads
          installer/__main__.py

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.nuitka_output }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/installer-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          name: Windows XP Setup ${{ github.ref_name }}
          files: release/*
          body: |
            Automated build of the Windows XP Setup Wizard (`installer/`).

            These binaries are unsigned, on purpose -- this is a joke
            project, not a real OS installer. Windows SmartScreen and macOS
            Gatekeeper will both flag them on first run:

            - **Windows:** click "More info" -> "Run anyway".
            - **macOS:** right-click the binary -> "Open" (not double-click)
              the first time.

            The installer fetches the actual sim from this repo's `main`
            branch at run time, so it always installs the latest commit,
            not a snapshot from when this binary was built.
